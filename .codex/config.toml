# PAVAN CODEX OS v3 — balanced adaptive defaults.
# Keep model choice controlled by the Codex UI/account.
# Normal execution stays efficient; Plan mode gets more reasoning.

model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_reasoning_effort = "low"
interrupt_message = false
